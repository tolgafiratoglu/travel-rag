# Production stack (standalone — do not merge with docker-compose.yml).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Topology:
#   Internet → Caddy/Nginx (443) → 127.0.0.1:8000 → api
#   api ↔ [internal_net] ↔ ollama, qdrant, neo4j, postgres
#   api ↔ [outbound_net] → Gemini / internet
#
# Pull Ollama models BEFORE first prod start (ollama has no outbound on
# internal_net). Use local compose or a one-off pull, then switch to prod.
#
# DB/Ollama ports are NOT published. Host ingest against prod: attach a
# one-off container to internal_net, or run ingest with QDRANT_API_KEY=
# QDRANT_ADMIN_API_KEY via a temporary local publish.
#
# Requires strong passwords + Qdrant API keys in .env.

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.9.6}
    container_name: travel-rag-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_models:/root/.ollama
    networks:
      internal_net:
        aliases:
          - ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: ./api
    container_name: travel-rag-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # Explicit env only — do not env_file:.env (avoids Postgres secrets in API).
    environment:
      - SECRETS_ENV_PATH=/config/rag/.env
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - QWEN_LLM=${QWEN_LLM:-1b}
      - QWEN8B=${QWEN8B:-qwen3:8b}
      - QWEN1B=${QWEN1B:-qwen3:1.7b-q4_K_M}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
      - OLLAMA_GUARD_MODEL=${OLLAMA_GUARD_MODEL:-sileader/qwen3guard:0.6b}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_READ_ONLY_API_KEY:?Set QDRANT_READ_ONLY_API_KEY in .env}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-travel_chunks}
      - QDRANT_COLLECTION_MUSEUMS=${QDRANT_COLLECTION_MUSEUMS:-travel_museums}
      - QDRANT_COLLECTION_HISTORICAL=${QDRANT_COLLECTION_HISTORICAL:-travel_historical_sites}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-5}
      - RATE_LIMIT_BURST_WINDOW_SECONDS=${RATE_LIMIT_BURST_WINDOW_SECONDS:-60}
      - RATE_LIMIT_HOURLY=${RATE_LIMIT_HOURLY:-30}
    volumes:
      - ${HOME}/.config/rag:/config/rag:ro
    networks:
      - internal_net
      - outbound_net
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    container_name: travel-rag-qdrant
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_ADMIN_API_KEY:?Set QDRANT_ADMIN_API_KEY in .env}
      - QDRANT__SERVICE__READ_ONLY_API_KEY=${QDRANT_READ_ONLY_API_KEY:?Set QDRANT_READ_ONLY_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    container_name: travel-rag-neo4j
    restart: unless-stopped
    environment:
      # Only NEO4J_AUTH — do not set NEO4J_PASSWORD (image maps NEO4J_* → conf;
      # NEO4J_PASSWORD becomes invalid setting "PASSWORD" and Neo4j won't start).
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    container_name: travel-rag-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-travel}
      - POSTGRES_USER=${POSTGRES_USER:-travel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/wiki:/data/wiki:ro
    networks:
      - internal_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
    external: true
    name: qwen_ollama_models
  qdrant_data:
  neo4j_data:
  postgres_data:

networks:
  internal_net:
    internal: true
  outbound_net:

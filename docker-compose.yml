services:
  ollama:
    image: ollama/ollama:latest
    container_name: travel-rag-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_models:/root/.ollama
    networks:
      llm_internal:
        aliases:
          - ollama
    dns:
      - 1.1.1.1
      - 1.0.0.1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: ./api
    container_name: travel-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SECRETS_ENV_PATH=/config/rag/.env
    volumes:
      - ${HOME}/.config/rag:/config/rag:ro
    networks:
      - llm_internal
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: travel-rag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - llm_internal

  neo4j:
    image: neo4j:5-community
    container_name: travel-rag-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/changeme
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - llm_internal
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
    external: true
    name: qwen_ollama_models
  qdrant_data:
  neo4j_data:

networks:
  llm_internal:

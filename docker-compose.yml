services:
  ollama:
    image: ollama/ollama:latest
    container_name: travel-rag-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      llm_internal:
        aliases:
          - ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: ./api
    container_name: travel-rag-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SECRETS_ENV_PATH=/config/rag/.env
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=changeme
    volumes:
      - ${HOME}/.config/rag:/config/rag:ro
    networks:
      - llm_internal
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: travel-rag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    networks:
      - llm_internal

  neo4j:
    image: neo4j:5-community
    container_name: travel-rag-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/changeme
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - llm_internal
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    container_name: travel-rag-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=changeme
      - MARIADB_DATABASE=wikivoyage
      - MARIADB_USER=wikivoyage
      - MARIADB_PASSWORD=changeme
    command:
      - --max-allowed-packet=512M
      - --innodb-buffer-pool-size=1G
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data/wikivoyage:/data/wikivoyage:ro
    ports:
      - "3306:3306"
    networks:
      - llm_internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
    external: true
    name: qwen_ollama_models
  qdrant_data:
  neo4j_data:
  mariadb_data:

networks:
  llm_internal:

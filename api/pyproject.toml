[project]
name = "travel-rag-api"
version = "0.1.0"
description = "Travel RAG — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "qdrant-client>=1.9",
    "neo4j>=5.0",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "tourism-graphrag-api"
version = "0.1.0"
description = "Tourism GraphRAG — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

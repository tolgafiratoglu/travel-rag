# Local / default stack.
# DB and API ports bind to 127.0.0.1 only (not 0.0.0.0).
# Production: docker compose -f docker-compose.prod.yml up -d --build
#
# Set strong passwords in .env (see .env.example). Do not commit secrets.

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.9.6}
    container_name: travel-rag-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_MAX_LOADED_MODELS=4
      - OLLAMA_KEEP_ALIVE=-1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      llm_internal:
        aliases:
          - ollama
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build: ./api
    container_name: travel-rag-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # Explicit env only — do not env_file:.env (avoids MariaDB secrets in API).
    environment:
      - SECRETS_ENV_PATH=/config/rag/.env
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
      - QWEN_LLM=${QWEN_LLM:-1b}
      - QWEN8B=${QWEN8B:-qwen3:8b}
      - QWEN1B=${QWEN1B:-qwen3:1.7b-q4_K_M}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-bge-m3}
      - OLLAMA_GUARD_MODEL=${OLLAMA_GUARD_MODEL:-sileader/qwen3guard:0.6b}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_READ_ONLY_API_KEY:-}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-travel_chunks}
      - QDRANT_COLLECTION_MUSEUMS=${QDRANT_COLLECTION_MUSEUMS:-travel_museums}
      - QDRANT_COLLECTION_HISTORICAL=${QDRANT_COLLECTION_HISTORICAL:-travel_historical_sites}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-5}
      - RATE_LIMIT_BURST_WINDOW_SECONDS=${RATE_LIMIT_BURST_WINDOW_SECONDS:-60}
      - RATE_LIMIT_HOURLY=${RATE_LIMIT_HOURLY:-30}
    volumes:
      - ${HOME}/.config/rag:/config/rag:ro
    networks:
      - llm_internal
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    container_name: travel-rag-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - llm_internal
    security_opt:
      - no-new-privileges:true
    # Auth keys are required in docker-compose.prod.yml only (local stays open on 127.0.0.1).

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community}
    container_name: travel-rag-neo4j
    restart: unless-stopped
    environment:
      # Only NEO4J_AUTH — do not set NEO4J_PASSWORD (image maps NEO4J_* → conf;
      # NEO4J_PASSWORD becomes invalid setting "PASSWORD" and Neo4j won't start).
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    networks:
      - llm_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11.4}
    container_name: travel-rag-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env}
      - MARIADB_DATABASE=${MARIADB_DATABASE:-travel}
      - MARIADB_USER=${MARIADB_USER:-travel}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:?Set MARIADB_PASSWORD in .env}
    command:
      - --max-allowed-packet=512M
      - --innodb-buffer-pool-size=1G
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data/wiki:/data/wiki:ro
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - llm_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_models:
    external: true
    name: qwen_ollama_models
  qdrant_data:
  neo4j_data:
  mariadb_data:

networks:
  llm_internal:
